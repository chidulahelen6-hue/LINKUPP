
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEON DASH 3D</title>

  <meta name="theme-color" content="#080014">
  <meta name="description" content="Race through a futuristic neon city in NEON DASH 3D.">

  <link rel="icon" type="image/png" href="neon-icon.png">
  <link rel="apple-touch-icon" href="neon-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05000d;
    }

    #game-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 40%, #211047 0%, #080014 65%, #020006 100%);
    }

    #game-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
  </style>
</head>

<body>
  <div id="game-container">

    <div class="top-bar">
      <div class="stat">
        <span>SCORE</span>
        <strong id="score">0</strong>
      </div>

      <div class="stat">
        <span>BEST</span>
        <strong id="best">0</strong>
      </div>

      <div class="stat">
        <span>COINS</span>
        <strong id="coins">0</strong>
      </div>

      <button id="sound-btn" aria-label="Toggle sound">🔊</button>
      <button id="pause-btn" aria-label="Pause game">Ⅱ</button>
    </div>

    <div id="level">LEVEL 1</div>
    <div id="message"></div>

    <div id="menu" class="overlay">
      <div class="menu-content">
        <p class="eyebrow">THE FUTURE IS YOURS</p>
        <h1>NEON <span>DASH</span></h1>
        <p class="subtitle">3D CYBER RUNNER</p>

        <div class="menu-decoration">⚡</div>

        <button id="start-btn" class="main-btn">▶ START RUN</button>
        <button id="skins-btn" class="secondary-btn">🎨 RUNNER SKINS</button>

        <p class="hint">DODGE · JUMP · COLLECT · SURVIVE</p>
      </div>
    </div>

    <div id="pause-screen" class="overlay hidden">
      <div class="menu-content">
        <h2>GAME PAUSED</h2>
        <button id="resume-btn" class="main-btn">▶ RESUME</button>
        <button id="restart-btn" class="secondary-btn">↻ RESTART</button>
        <button id="home-btn" class="secondary-btn">⌂ HOME</button>
      </div>
    </div>

    <div id="game-over" class="overlay hidden">
      <div class="menu-content">
        <p class="eyebrow">RUN COMPLETE</p>
        <h2>GAME OVER</h2>
        <p>FINAL SCORE</p>
        <strong id="final-score">0</strong>
        <p>COINS COLLECTED: <span id="final-coins">0</span></p>
        <button id="play-again-btn" class="main-btn">↻ PLAY AGAIN</button>
        <button id="game-over-home-btn" class="secondary-btn">⌂ HOME</button>
      </div>
    </div>

    <div id="skins-screen" class="overlay hidden">
      <div class="menu-content">
        <h2>RUNNER SKINS</h2>
        <p>COINS: <strong id="shop-coins">0</strong></p>
        <div id="skin-list"></div>
        <button id="skins-back-btn" class="secondary-btn">← BACK</button>
      </div>
    </div>

    <div class="mobile-controls">
      <button id="left-btn" aria-label="Move left">◀</button>
      <button id="jump-btn" aria-label="Jump">▲</button>
      <button id="right-btn" aria-label="Move right">▶</button>
    </div>

  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
