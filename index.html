
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080014">
  <title>NEON DASH 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <div id="game-container"></div>

    <header class="top-bar">
      <div class="logo">NEON<span>DASH</span></div>
      <div class="stats">
        <div>SCORE <strong id="score">0</strong></div>
        <div>BEST <strong id="best">0</strong></div>
        <div>COINS <strong id="coins">0</strong></div>
      </div>
      <button id="sound-btn" class="small-btn" aria-label="Toggle sound">🔊</button>
    </header>

    <div class="level-label" id="level">LEVEL 1</div>

    <section id="menu" class="overlay">
      <div class="menu-card">
        <p class="eyebrow">THE FUTURE IS YOURS</p>
        <h1>NEON<br><span>DASH</span></h1>
        <p class="subtitle">RUN • DODGE • COLLECT</p>
        <button id="start-btn" class="main-btn">▶ START RUN</button>
        <button id="skins-btn" class="secondary-btn">✦ RUNNER SKINS</button>
        <p class="help-text">Swipe left/right to move<br>Swipe up to jump</p>
      </div>
    </section>

    <section id="pause-screen" class="overlay hidden">
      <div class="menu-card">
        <h2>PAUSED</h2>
        <p>Take a breath, runner.</p>
        <button id="resume-btn" class="main-btn">▶ RESUME</button>
        <button id="restart-btn" class="secondary-btn">↻ RESTART</button>
        <button id="home-btn" class="secondary-btn">⌂ MAIN MENU</button>
      </div>
    </section>

    <section id="game-over" class="overlay hidden">
      <div class="menu-card">
        <p class="eyebrow">RUN COMPLETE</p>
        <h2>GAME OVER</h2>
        <p>Your score: <strong id="final-score">0</strong></p>
        <p>Coins collected: <strong id="final-coins">0</strong></p>
        <button id="play-again-btn" class="main-btn">↻ PLAY AGAIN</button>
        <button id="game-over-home-btn" class="secondary-btn">⌂ MAIN MENU</button>
      </div>
    </section>

    <section id="skins-screen" class="overlay hidden">
      <div class="menu-card skin-card">
        <h2>RUNNER SKINS</h2>
        <p>Choose your neon style.</p>
        <p>Available coins: <strong id="shop-coins">0</strong></p>
        <div id="skin-list"></div>
        <button id="skins-back-btn" class="secondary-btn">← BACK</button>
      </div>
    </section>

    <div id="mobile-controls">
      <button id="left-btn" aria-label="Move left">◀</button>
      <button id="jump-btn" aria-label="Jump">⬆ JUMP</button>
      <button id="right-btn" aria-label="Move right">▶</button>
    </div>

    <button id="pause-btn" class="small-btn hidden">Ⅱ</button>
    <div id="message" class="message"></div>
  </main>

  <script type="module" src="game.js"></script>
</body>
</html>
